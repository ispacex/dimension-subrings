# The blueprint of the paper (MATH-324, site/blueprint.py, site/blueprint.toml).
#   data: the checks that need neither the paper nor Lean (nodes, uses, rows of results.html, every
#         declaration found in the sources of groups/);
#   lean: every Lean declaration the blueprint names exists, checked by Lean itself (the equivalent of
#         `leanblueprint checkdecls`): a generated file #checks each of them against the package
#         pinned in groups/;
#         It also compares the attribute @[d5 ...] of the package (MATH-453; `#d5_tags`, printed by
#         groups/D5Tags.lean) with the nodes: the (label, declaration) pairs must be the same, so a
#         tag in the code cannot drift from blueprint.toml, which stays the source of truth;
#   web:  the leanblueprint pages build (plasTeX, versions pinned in site/blueprint-requirements.txt).
#         The paper is not in this repository, so here the statements are placeholders; the pages
#         on the site are built with the paper (site/build_site.py --blueprint).
name: blueprint
on:
  pull_request:
    paths: ['site/blueprint*', 'groups', '.github/workflows/blueprint.yml']
  push:
    branches: [main]
    paths: ['site/blueprint*', 'groups', '.github/workflows/blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init groups
      - run: python3 site/blueprint.py check
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init groups
      - name: the declarations, as a Lean file
        run: python3 site/blueprint.py lean groups/BlueprintDecls.lean && cat groups/BlueprintDecls.lean
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: groups
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: build the modules and check every declaration
        working-directory: groups
        run: |
          set -o pipefail
          lake build $(sed -n 's/^public import //p' BlueprintDecls.lean)
          lake env lean BlueprintDecls.lean 2>&1 | tee decls.log
          want=$(grep -c '^#check @' BlueprintDecls.lean)
          if grep -q ': error' decls.log; then echo "::error::a declaration of the blueprint is not in the package"; exit 1; fi
          echo "blueprint: all $want declarations exist"
      - name: the @[d5] tags of the package are exactly the declarations of the nodes
        working-directory: groups
        run: |
          set -o pipefail
          lake build GroupDimension GroupDimension.Cert1024.Prop1024
          lake env lean D5Tags.lean 2>&1 | tee tags.log
          python3 ../site/blueprint.py tags tags.log
      - name: negative controls (a missing tag, an extra label, an unregistered D5 tag must fail)
        working-directory: groups
        run: |
          # drop the last tag line; add a wrong label and an unregistered tag to a real tagged declaration;
          # each must fail with its own message (not with any error)
          d=GroupDimension.ExpThree.D_five_eq_gamma_five_g4_cube
          n=$(grep -n '"key":' tags.log | tail -1 | cut -d: -f1)
          sed "${n}d" tags.log > tags-missing.log
          { cat tags.log; echo "{\"key\":\"thm:no_such_label\",\"decl\":\"$d\",\"comment\":\"\"}"; } > tags-extra.log
          { cat tags.log; echo "{\"key\":\"D5:000P\",\"decl\":\"$d\",\"comment\":\"\"}"; } > tags-tag.log
          check() {
            if python3 ../site/blueprint.py tags "$1" > neg.out 2>&1; then echo "::error::the tag check passes $1"; exit 1; fi
            cat neg.out
            grep -qF "$2" neg.out || { echo "::error::$1 fails for another reason"; exit 1; }
          }
          check tags-missing.log 'but not tagged @[d5'
          check tags-extra.log 'but not in the lean field of node thm:no_such_label'
          check tags-tag.log 'a tag that no node of blueprint.toml has'
          echo "negative controls: a missing tag, an extra label and an unregistered tag fail, as they should"
      - name: negative control (a name that is not a declaration must fail)
        working-directory: groups
        run: |
          printf 'module\n\npublic import GroupDimension.Statements\n\n#check @GroupDimension.no_such_declaration_324\n' > BlueprintNeg.lean
          if lake env lean BlueprintNeg.lean > neg.log 2>&1; then echo "::error::the check passes a missing declaration"; exit 1; fi
          cat neg.log
          grep -qi "unknown constant\|unknown identifier" neg.log || { echo "::error::the negative control failed for another reason"; exit 1; }
          echo "negative control: a missing declaration fails, as it should"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init groups
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r site/blueprint-requirements.txt
      - name: leanblueprint pages (placeholders for the statements)
        run: |
          python3 site/blueprint.py src out
          cd out/src && plastex -c plastex.cfg web.tex
          test -s ../web/index.html && test -s ../web/dep_graph_document.html
          # every node is in the graph (plastexdepgraph draws only the theorem types it is told)
          for x in $(python3 -c "import sys,tomllib; print(' '.join(tomllib.load(open('../../site/blueprint.toml','rb'))['nodes']))"); do
            grep -q "\"$x\"" ../web/dep_graph_document.html || { echo "::error::$x is not in the dependency graph"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-web
          path: out/web
