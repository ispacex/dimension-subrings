# Builds the volunteer-computing image (boinc/Dockerfile) for x86_64 and aarch64 on native runners
# and pushes it to ghcr.io/<owner>/dimension-subrings-boinc:<tag>-amd64 / -arm64.  The digests are
# written to the job summary: boinc/buda/Dockerfile names the image by digest.
name: boinc image
on:
  workflow_dispatch:
  push:
    tags: ['boinc-v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build, run the pilot piece of the 2^12 search (MATH-40) in the image as BUDA runs it, and push only if
      # it agrees with the reference run on kimmy (boinc/pilot12/: the stat counters and the sha256 of the
      # candidate lines): a failed pilot publishes nothing.  The pilot is the first 10 library ids of the
      # LIBROOT step of rank 4 (README, "2^12"); its files are kept as an artifact.
      - name: build
        run: docker build -f boinc/Dockerfile --build-arg CODE_COMMIT="$GITHUB_SHA" -t "ghcr.io/${GITHUB_REPOSITORY,,}-boinc:${GITHUB_REF_NAME}-${{ matrix.arch }}" .
      - name: pilot piece (2^12, LIBROOT ids 60904-60913) against the reference
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}-boinc:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          mkdir -p pilot && cd pilot
          { echo '# piece v1 name=b_dL10 rank=4 nmax=11 logq=12 covermax=10 steprules=true compact=true flags=THMA,THMA1,THMB,TAH19,TIGHT,LIBROOT,NOSTAB,STREAM,STREAMFILE'
            echo '{"order":16,"code":0,"steps":[5],"ids":[60904,60913]}'; } > piece.txt
          docker run --rm --cpus 1 -v "$PWD:/app" "$tag" piece.txt result.txt 2> stderr.txt || { cat stderr.txt; exit 1; }
          tail -3 stderr.txt
          set -o pipefail
          python3 ../boinc/pilot12/check.py result.txt ../boinc/pilot12/b_dL10.stat.json \
            00af71cd1e60a69bda8573a589f0068453bd41779cbc807a5038ae5d291d1d59 | tee check.txt
          echo "pilot b_dL10 ${{ matrix.arch }}: $(cat check.txt | head -1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-${{ matrix.arch }}
          path: pilot/
      - name: push
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}-boinc:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          docker push "$tag"
          echo "$tag → $(docker inspect --format '{{index .RepoDigests 0}}' "$tag")" >> "$GITHUB_STEP_SUMMARY"
