en = '''$3$-torsion: the Bartholdi–Mikhailov $3$-group with $D_7\ne\gamma_7$ has order $3^{494}$, but its three quotients by central subgroups of order $3$ not containing the witness $\omega$ have order $3^{493}$ and $D_7\ne\gamma_7$, so $3^{494}$ is not the least order of a $3$-group with $D_7\ne\gamma_7$; every proper quotient of these three groups kills $\omega$. That $\omega\in D_7$ follows from Bartholdi–Mikhailov's Prop. 9.2 via the map (not onto) from their group (9.2) to $G$. Subgroups of either group are checked only against BM's argument and only for $H\ge\Phi(Q)\langle x_1,\dots,x_4\rangle$; other subgroups, other arguments, and new witnesses in quotients, not checked ({{gh:compute/magnus/bm494/README.md|code}}).'''
