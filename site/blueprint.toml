ru = '''Нижняя оценка для $D_4\ne\gamma_4$: такая $2$-группа имеет порядок $\ge2^{11}$, так что $D_4(G)=\gamma_4(G)$ для всякой конечной $G$ с силовской $2$-подгруппой порядка $\le2^{10}$. Наименьший известный пример — группа Рипса порядка $2^{38}$. Порядок $2^{10}$: условие $n\in D_4$ на $p$-накрывающей группе линейно по гиперплоскости $U$ (лемма Накаямы), и ни у одного из $10\,208\,630$ родителей порядка $2^9$ нет $U$ с $n\in D_4$ ({{gh:compute/pq1024/README.md|код}}).'''
en = '''A lower bound for $D_4\ne\gamma_4$: such a $2$-group has order $\ge2^{11}$, so $D_4(G)=\gamma_4(G)$ for every finite $G$ with Sylow $2$-subgroup of order $\le2^{10}$. The smallest known example is Rips's group, of order $2^{38}$. Order $2^{10}$: the condition $n\in D_4$ on the $p$-covering group is linear in the hyperplane $U$ (Nakayama's lemma), and none of the $10\,208\,630$ parents of order $2^9$ has a $U$ with $n\in D_4$ ({{gh:compute/pq1024/README.md|code}}).'''
