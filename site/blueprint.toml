# The blueprint of the paper (MATH-324) and the rows of results.html: the one place where the status
# of a statement is written down. site/blueprint.py reads it; build_site.py builds results.html and
# blueprint.html from it, and the leanblueprint web pages (blueprint/) come from it and the paper.
#
# [nodes."<label>"]: one per labelled statement of paper/d5.tex (every one must be here), and a few
# results of the literature that the formalization proves too ("ext:..." labels, with their own
# statement), and our own results that it proves but the paper does not contain ("own:..." labels,
# the same fields; e.g. own:ab399, MATH-448). Fields:
#   lean     the Lean declarations (full names) that state or prove it; CI checks that each exists
#            (.github/workflows/blueprint.yml) and the build that each is named in the paper's
#            section on the formalization; each carries the attribute @[d5 "<label>"] in groups/
#            (MATH-453, MATH-458; permanent tags D5:XXXX come with MATH-457), and CI checks that the tagged pairs are exactly these (blueprint.py tags);
#   proved   true if the proof is formalized, from the statements it uses (leanblueprint's \leanok on
#            the proof); a statement with `lean` but not `proved` has only its statement (or a part)
#            in Lean;
#   computer true if the proof rests on a computation (the paper's "Computer-assisted");
#   uses     statements the proof uses besides those the paper's proof refers to (\ref in the proof
#            are taken from the paper); uses_drop: references of the proof that are not dependencies;
#   not_in_paper  declarations that the paper's section on the formalization does not name (the
#            check that it names every declaration of a node skips them);
#   not_formalized  true for a statement of the paper that is not in Lean although its proof says
#            that something it relies on is formalized (e.g. Tahara's Theorem 6.1); it turns off only
#            the check that a statement the paper calls formally verified names Lean declarations;
#   note     what the Lean version differs in, or what is not formalized (shown in the blueprint
#            and on blueprint.html), and note_ru, the same in Russian; a number of the paper is
#            written [[label|#]] (the build puts in the number and checks the label); title, title_ru and statement
#            (LaTeX, English) of an ext: or own: node.
#
# [[results]]: the rows of results.html (they were RESULTS in build_site.py): status ("l" Lean, "p"
# paper, "c" computer, "cp" computer + paper, "k" known from the literature, "o" open), the text in both languages, and where it is.
# [[label]] links to the paper; {{lean:Name|text}} to the declaration (the name must be in a node);
# {{gh:path|text}} and {{gh:path|text|symbol}} to this repository at the pinned commit. A row marked
# "l" may cite only statements whose proof is in Lean.

# Declarations that the paper's section on the formalization names but that belong to no node: the
# authors' Lie-ring theorem, imported only by the version lean-v4.29, and the computation lemma of
# Theorems 6.9 and 6.10 (SetupGen.gen_eq_one; SetupA.row, SetupA.gen_eq_one; named in §4 by their
# namespace-qualified short names).
section4_not_nodes = ["LieRings.Publication.corollaryD", "SetupGen.gen_eq_one", "SetupA.row", "SetupA.gen_eq_one"]

