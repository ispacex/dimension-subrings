note = "Not Passi's argument: through Tahara's map ψ_3 (his §5, formalized with his Theorem 6.1), for finite p-groups of class ≤ 3, then by reduction."
note_ru = "Не рассуждение Пасси: через отображение ψ_3 Тахары (его §5, формализован вместе с его теоремой 6.1) для конечных p-групп ступени ≤ 3, затем сведением."

[nodes."ext:gruenberg"]
title = "Gruenberg"
title_ru = "Грюнберг"
statement = '''In a finitely generated nilpotent group an element none of whose odd powers is trivial survives in some finite $2$-group quotient.'''
lean = ["GroupDimension.GruenbergResidualTwo", "GroupDimension.gruenbergResidualTwo", "GroupDimension.Gruenberg.residuallyFinite"]
proved = true

[nodes."ext:tahara61"]
title = "Tahara, Theorem 6.1, the inclusion"
title_ru = "Тахара, теорема 6.1, включение"
statement = '''For a finite group of class $\le4$ and any uniqueness bases with their structure constants, $D_5$ lies in the subgroup generated by the elements $g$ over the integer families satisfying Tahara's conditions (A)--(F).'''
lean = ["GroupDimension.TaharaFiveOne", "GroupDimension.taharaFiveOne"]
proved = true

[nodes."ext:jennings"]
title = "Jennings, the inclusion for $p=2$, $n=5$"
title_ru = "Дженнингс, включение при $p=2$, $n=5$"
statement = '''For a finite $2$-group $Q$ of class $\le3$, $D_5(Q)\subseteq Q\cap(1+\Delta_{\mathbb F_2}(Q)^5)\subseteq Q^8\gamma_2(Q)^4\gamma_3(Q)^2$.'''
lean = ["GroupDimension.D_five_le_jennings"]
proved = true
note = "The general theorem of Jennings and Lazard's description of the series are not formalized."
note_ru = "Общая теорема Дженнингса и описание ряда Лазаром не формализованы."

[nodes."ext:guptatahara"]
title = "Gupta–Tahara"
title_ru = "Гупта–Тахара"
statement = '''$D_{p+2}(G)=\gamma_{p+2}(G)$ for every finite metabelian $p$-group $G$, $p$ odd.'''
lean = ["GroupDimension.GuptaTaharaMetabelian", "GroupDimension.GuptaTaharaMetabelianThree", "GroupDimension.guptaTaharaMetabelian_three"]
note = "Stated in Lean; proved for p = 3 (guptaTaharaMetabelian_three, Theorem [[thm:gt3|#]]); for general p not proved, an explicit hypothesis where it is used."
note_ru = "В Lean сформулирована; при p = 3 доказана (guptaTaharaMetabelian_three, теорема [[thm:gt3|#]]); при общем p не доказана, там, где используется, — явная гипотеза."


[nodes."own:ab399"]
title = "$D_5=1$ for $Q_{ab}\\cong C_3\\times C_9\\times C_9$"
title_ru = "$D_5=1$ при $Q_{ab}\\cong C_3\\times C_9\\times C_9$"
statement = '''Let $Q$ be a finite group of class $\le4$ with $Q/\gamma_2(Q)\cong C_3\times C_9\times C_9$. Then $D_5(Q)=1$. No condition on $\gamma_4(Q)$ is assumed.'''
lean = ["GroupDimension.D_five_eq_bot_of_class_four_ab399", "GroupDimension.Ab399.D_five_eq_bot_of_class_four_ab399",
        "GroupDimension.Star.two_smul_gen_eq"]
proved = true
uses = ["ext:tahara61"]
note = "Not in the paper (the authors' decision): the proof on paper is MATH-446 (wiki 891 §10, one review per 703), the Lean proof group-dimension#48 (MATH-448). It covers γ_4 of exponent 9 (e.g. γ_4 ≅ C_9), the case that Remark [[rem:g4c9|#]] leaves open, for this type of Q_ab; for γ_4^3 = 1 it is a case of Theorem [[thm:g4cube|#]]. Star.two_smul_gen_eq is the exact identity (⋆) of the proof of Theorem [[thm:g4cube|#]], for Tahara's data and any admissible τ in a group of class ≤ 4, with no condition on γ_4; the Lean proof of Theorem [[thm:g4cube|#]] does not use it. GroupDimension.Ab399.D_five_eq_bot_of_class_four_ab399 takes Tahara's inclusion as a hypothesis, the unprefixed one discharges it. Only the finite form of class ≤ 4 is in Lean; the general form D_5(G) = γ_5(G) for G_ab ≅ C_3 × C_9 × C_9 is not formalized. Other types of Q_ab with γ_4 ≅ C_9 are open (MATH-450)."
note_ru = "Не в статье (решение авторов): доказательство на бумаге — MATH-446 (вики 891 §10, одна рецензия по 703), в Lean — group-dimension#48 (MATH-448). Покрывает γ_4 экспоненты 9 (например, γ_4 ≅ C_9) — случай, который замечание [[rem:g4c9|#]] оставляет открытым, — для этого типа Q_ab; при γ_4^3 = 1 это частный случай теоремы [[thm:g4cube|#]]. Star.two_smul_gen_eq — точное тождество (⋆) из доказательства теоремы [[thm:g4cube|#]] для данных Тахары и любого допустимого τ в группе ступени ≤ 4, без условий на γ_4; Lean-доказательство теоремы [[thm:g4cube|#]] его не использует. GroupDimension.Ab399.D_five_eq_bot_of_class_four_ab399 берёт включение Тахары гипотезой, версия без префикса её снимает. В Lean только конечная форма для ступени ≤ 4; общая форма D_5(G) = γ_5(G) при G_ab ≅ C_3 × C_9 × C_9 не формализована. Другие типы Q_ab при γ_4 ≅ C_9 открыты (MATH-450)."

