# The rows of results.html, in their order.

[[results]]
status = "l"
ru = '''Сведение: $D_5(G)\subseteq\gamma_4(G)$ для всех групп $\iff$ $D_5(Q)=1$ для всех конечных $2$-групп ступени $3$. Для конечных $G$ порядок не растёт: достаточно $2$-групп порядка не больше $2$-части $|G|$. Доказано в Lean без гипотез: теоремы Пасси ($D_4^2\subseteq\gamma_4$) и Грюнберга и $D_3=\gamma_3$ там тоже доказаны.'''
en = '''Reduction: $D_5(G)\subseteq\gamma_4(G)$ for all groups $\iff$ $D_5(Q)=1$ for all finite $2$-groups of class $3$. For finite $G$ the order does not grow: $2$-groups up to the $2$-part of $|G|$ suffice. Proved in Lean without hypotheses: Passi's theorem ($D_4^2\subseteq\gamma_4$), Gruenberg's theorem and $D_3=\gamma_3$ are proved there too.'''
where_ru = '''[[prop:reduction]], [[rem:bounded]]; {{lean:GroupDimension.dimensionQuestion5_iff_class_three'|Lean}}'''
where_en = '''[[prop:reduction]], [[rem:bounded]]; {{lean:GroupDimension.dimensionQuestion5_iff_class_three'|Lean}}'''

[[results]]
status = "l"
ru = '''Для колец Ли $D_5(L)\subseteq\gamma_4(L)$ (<a href="https://arxiv.org/abs/2610.02042">Ионин, Михайлов, Петров, 2026</a>); {{gh:notes/formalization-audit.ru.md|формализация проверена}}, групповой вопрос {{lean:GroupDimension.DimensionQuestion5|сформулирован в Lean}} рядом.'''
en = '''For Lie rings $D_5(L)\subseteq\gamma_4(L)$ (<a href="https://arxiv.org/abs/2610.02042">Ionin, Mikhailov, Petrov, 2026</a>); {{gh:notes/formalization-audit.md|the formalization audited}}, the group question {{lean:GroupDimension.DimensionQuestion5|stated in Lean}} next to it.'''
where = '''[[sec:lie]], [[sec:lean]]'''

[[results]]
status = "cp"
ru = '''$D_5(G)\subseteq\gamma_4(G)$ для всякой конечной $G$ с силовской $2$-подгруппой <a href="computations.html#f210">порядка $\le2^{10}$</a>, в частности для всех групп порядка $<2048$. Что у всех $3400$ кандидатов порядка $2^{10}$ $D_4=D_5=1$, проверено и в Lean, сертификатами (через <code>native_decide</code>); полнота списка — лемма [[lem:mincex|#]](d) и вычисление ANUPQ.'''
