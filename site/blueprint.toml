ru = '''Ещё общее: $D_5(G)=\gamma_5(G)$, если $G/\gamma_2(G)$ — конечная $3$-группа и $\gamma_2(G)/\gamma_3(G)$ имеет экспоненту $3$, при любых инвариантах $G/\gamma_2(G)$ (например, $C_9\times C_9\times C_3$, если $\gamma_2/\gamma_3$ экспоненты $3$); теоремы [[thm:exp3|#]] и [[thm:exp3plus|#]] — следствия. Проверено независимой рецензией и доказано в Lean вместе с теоремой 6.1 Тахары. Отсюда у минимального контрпримера $\exp(\gamma_2/\gamma_3)\ge9$, а $\gamma_4\le Z$ циклична.'''
